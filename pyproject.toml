[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[project]
name = "edraft"
version = "0.1.0"
description = "Causal energy adaptation for exact DFlash speculative decoding"
requires-python = ">=3.12,<3.13"
dependencies = [
  "dflash[local]",
  "accelerate==1.12.0",
  "pytest==9.0.2",
  "numpy==2.3.5",
]

[tool.uv.sources]
dflash = { path = "vendor/dflash", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/edraft"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["reference: requires downloaded real model checkpoints and GPU"]
